services:
  # Backend API Service (Python/FastAPI)
  - type: web
    name: prompt-composer-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: prompt-composer-db
          property: connectionString
      - key: MILVUS_HOST
        value: "localhost"
      - key: MILVUS_PORT
        value: "19530"
      - key: MILVUS_MODE
        value: "lite"
      - key: EMBEDDING_MODEL
        value: "text-embedding-ada-002"
      - key: OPENAI_API_KEY
        sync: false  # You'll add this in Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false  # You'll add this in Render dashboard
    plan: free  # Free tier!

databases:
  - name: prompt-composer-db
    plan: free  # Free PostgreSQL!
    databaseName: prompt_composer
    user: prompt_user