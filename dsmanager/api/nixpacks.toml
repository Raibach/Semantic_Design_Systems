[phases.setup]
nixPkgs = ["python311", "mupdf", "nodejs_20"]

[phases.install]
cmds = [
    "python3 -m venv /app/.venv",
    "source /app/.venv/bin/activate && pip install --no-cache-dir -r requirements.txt",
    "echo '📦 Installing frontend dependencies...'",
    "cd frontend && npm ci --prefer-offline || (echo '❌ npm install failed!' && exit 1)",
    "echo '🔨 Building frontend (this must run - dist was removed from git)...'",
    "cd frontend && npm run build || (echo '❌ Frontend build FAILED!' && exit 1)",
    "echo '✅ Frontend build command completed'",
    "echo '📁 Verifying build output exists...'",
    "pwd",
    "echo 'Current directory contents:'",
    "ls -la",
    "echo 'Frontend directory contents:'",
    "ls -la frontend/ || (echo '❌ frontend directory not found!' && exit 1)",
    "if [ ! -d 'frontend/dist' ]; then echo '❌ CRITICAL: frontend/dist directory does not exist!' && echo 'Frontend directory contents:' && ls -la frontend/ && exit 1; fi",
    "if [ ! -f 'frontend/dist/index.html' ]; then echo '❌ CRITICAL: frontend/dist/index.html not found!' && exit 1; fi",
    "echo '✅ Frontend build verified - dist folder exists with index.html'",
    "echo '📊 Build output summary:'",
    "du -sh frontend/dist",
    "ls -la frontend/dist/ | head -10",
    "echo '✅ Build phase completed successfully'"
]

[start]
cmd = "source /app/.venv/bin/activate && uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 2 --timeout-keep-alive 120"
